[build]
  base = "react-app"
  command = "npm run build"
  publish = "dist"

# Client-side routing (React Router): any path that isn't a real static
# file falls through to index.html so direct navigation/refresh on routes
# like /about-us or /210-paint-protection-film works instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
